name: Keep Backend Awake

# Pings the Render backend every 10 minutes so the free-tier service
# never spins down. A spun-down service takes ~30s+ to cold-start, which
# exceeds the frontend request timeout and shows users a "backend not
# running" error. Keeping it warm means users always hit a live server.

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (UTC)
  workflow_dispatch:          # allows manual run from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          echo "Pinging backend health endpoint..."
          code=$(curl -s -m 60 -o /dev/null -w "%{http_code}" https://internshipconnect-af9x.onrender.com/health || echo "000")
          echo "Response code: $code"
          if [ "$code" != "200" ]; then
            echo "Warning: backend did not return 200 (got $code) — it may have been cold. Retrying once..."
            sleep 5
            code=$(curl -s -m 60 -o /dev/null -w "%{http_code}" https://internshipconnect-af9x.onrender.com/health || echo "000")
            echo "Retry response code: $code"
          fi
